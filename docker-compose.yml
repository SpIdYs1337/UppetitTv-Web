services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: uppetit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./uppetit-tv-backend
    restart: always
    # Бэкенд больше не торчит наружу, порты удалены
    environment:
      - DATABASE_URL=postgresql://admin:admin_password@db:5432/uppetit_db?schema=public
    depends_on:
      - db

  frontend:
    build: ./uppetit-tv-admin
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend

volumes:
  pgdata: